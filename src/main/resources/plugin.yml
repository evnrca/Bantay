name: Bantay
version: ${project.version}
main: com.evnrca.bantay.Bantay
api-version: 1.20
author: evnrca
description: Filipino-focused chat moderation plugin for Minecraft servers

commands:
  bantay:
    description: Main command for Bantay plugin
    aliases: [bt]
    usage: /bantay <reload|bypass|help>
    permission: bantay.admin
    permission-message: "&cYou don't have permission to use this command."

permissions:
  bantay.bypass:
    description: Bypasses chat filter and cooldowns
    default: op
  bantay.admin:
    description: Access to reload and config commands
    default: op