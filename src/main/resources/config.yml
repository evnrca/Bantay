# Bantay Configuration
# "Bantay" - Filipino for "guard/watchman"
# A lightweight chat moderation plugin specialized in filtering Filipino (Tagalog/Taglish) profanity

# ==============================================================================
# PROFANITY FILTER SETTINGS
# ==============================================================================
filter:
  # Enable/disable Filipino (Tagalog/Taglish) profanity filtering
  # This is the primary, specialized filter for Filipino profanity
  filipino-enabled: true

  # Enable/disable English profanity filtering
  # This is a secondary, optional filter - server owners can extend the list
  english-enabled: true

  # Normalize common leetspeak substitutions before matching
  # When true, converts @/4->a, 3->e, 1/!->i, 0->o, $->s
  # Also applies custom aliases from the aliases map below
  normalize-leetspeak: true

  # Custom shorthand-to-root mappings for Filipino texting style
  # Add your own common abbreviations here (e.g., "tgna" -> "tangina")
  # Keys are the shorthand, values are the root word they map to
  aliases:
    "tgna": "tangina"
    "pgna": "pangina"
    "pkyn": "pakyu"
    "pksht": "pakshet"
    "ggo": "gago"
    "gga": "gaga"
    "bbo": "bobo"
    "tng": "tanga"
    "ulol": "ulol"
    "kpl": "kupal"

  # Collapse 3+ repeated characters before matching
  # e.g., "tanginaaaa" -> "tangina", "bobo!!!" -> "bobo"
  strip-repeated-chars: true

  # Regex patterns for profanity detection
  # These replace the old word lists - regex handles variants, leetspeak, spacing
  regex-patterns:
    filipino:
      # putangina / putang ina / tangina / tang ina variants
      - "(p|P)[uU]*[tT]+[@4aA]+[nN]+[gG]+[@4aA]+[iI!1]+[nN]+[@4aA]+"
      - "(p|P)[uU]*[tT]+[@4aA]+[nN]+[gG]+\\s*[iI!1]+[nN]+[@4aA]+"
      - "(t|T)[@4aA]+[nN]+[gG]+[@4aA]+[iI!1]+[nN]+[@4aA]+"
      - "(t|T)[@4aA]+[nN]+[gG]+\\s*[iI!1]+[nN]+[@4aA]+"
      # gago/gaga
      - "(g|G)[@4aA]+[gG]+[@4aA]+"
      # ulol
      - "(u|U)[lL]+[@0oO]+[lL]+"
      # bobo
      - "(b|B)[@0oO]+[bB]+[@0oO]+"
      # tanga
      - "(t|T)[@4aA]+[nN]+[gG]+[@4aA]+"
      # punyeta
      - "(p|P)[uU]+[nN]+[yY]+[eE3]+[tT]+[@4aA]+"
      # leche
      - "(l|L)[eE3]+[cC]+[hH]+[eE3]+"
      # pakshet
      - "(p|P)[@4aA]+[kK]+[sS$]+[hH]+[eE3]+[tT]+"
      # pakyu
      - "(p|P)[@4aA]+[kK]+[yY]+[uU]+"
      # hayop/hayup
      - "(h|H)[@4aA]+[yY]+[@0oO]+[pP]+"
      - "(h|H)[@4aA]+[yY]+[uU]+[pP]+"
      # kupal
      - "(k|K)[uU]+[pP]+[@4aA]+[lL]+"
      # tarantado
      - "(t|T)[@4aA]+[rR]+[@4aA]+[nN]+[tT]+[@4aA]+[dD]+[@0oO]+"
      # lintik
      - "(l|L)[iI!1]+[nN]+[tT]+[iI!1]+[kK]+"
      # peste
      - "(p|P)[eE3]+[sS$]+[tT]+[eE3]+"
      # pucha
      - "(p|P)[uU]+[cC]+[hH]+[@4aA]+"
      # puta
      - "(p|P)[uU]+[tT]+[@4aA]+"
      # inutil
      - "(iI!1)+[nN]+[uU]+[tT]+[iI!1]+[lL]+"
      # sira ulo
      - "(s|S)[iI!1]+[rR]+[@4aA]+\\s*(u|U)[lL]+[@0oO]+"
    english:
      # damn / damn it / dammit
      - "(d|D)[@4aA]+[mM]+[nN]+[nN]*"
      - "(d|D)[@4aA]+[mM]+[iI!1]+[tT]+"
      # hell
      - "(h|H)[eE3]+[lL]+[lL]+"
      # shit / shitty / bullshit
      - "(s|S)[hH]+[iI!1]+[tT]+[yY]*"
      - "(b|B)[uU]+[lL]+[lL]+[sS$]+[hH]+[iI!1]+[tT]+"
      # fuck / fucker / fucking / motherfucker
      - "(f|F)[uU]+[cC]+[kK]+[eE3]*[rR]*"
      - "(f|F)[uU]+[cC]+[kK]+[iI!1]+[nN]+[gG]+"
      - "(m|M)[oO0]+[tT]+[hH]+[eE3]+[rR]+[f|F][uU]+[cC]+[kK]+[eE3]*[rR]*"
      # bitch / bitches / son of a bitch
      - "(b|B)[iI!1]+[tT]+[cC]+[hH]+[eE3]*[sS$]*"
      - "(s|S)[oO0]+[nN]+\\s*[oO0]+[fF]+\\s*[a|A]+\\s*(b|B)[iI!1]+[tT]+[cC]+[hH]+"
      # ass / asshole / asshat / jackass / dumbass
      - "(a|A)[sS$]+[sS$]+[hH]+[oO0]+[lL]+[eE3]*"
      - "(a|A)[sS$]+[sS$]+[hH]+[@4aA]+[tT]+"
      - "(j|J)[@4aA]+[cC]+[kK]+[a|A][sS$]+[sS$]+"
      - "(d|D)[uU]+[mM]+[bB]+[@4aA]+[sS$]+[sS$]+"
      # crap / crappy
      - "(c|C)[rR]+[@4aA]+[pP]+[pP]*[yY]*"
      # piss / pissing / pissed
      - "(p|P)[iI!1]+[sS$]+[sS$]+[iI!1]*[nN]*[gG]*"
      - "(p|P)[iI!1]+[sS$]+[sS$]+[eE3]+[dD]+"
      # cock / cunt / twat / pussy / dick / prick
      - "(c|C)[oO0]+[cC]+[kK]+"
      - "(c|C)[uU]+[nN]+[tT]+"
      - "(t|T)[wW]+[@4aA]+[tT]+"
      - "(p|P)[uU]+[sS$]+[sS$]+[yY]+"
      - "(d|D)[iI!1]+[cC]+[kK]+"
      - "(p|P)[rR]+[iI!1]+[cC]+[kK]+"
      # whore / slut / hoe / skank
      - "(w|W)[hH]+[@0oO]+[rR]+[eE3]*"
      - "(s|S)[lL]+[uU]+[tT]+"
      - "(h|H)[oO0]+[eE3]*"
      - "(s|S)[kK]+[@4aA]+[nN]+[kK]+"
      # bastard / bollocks / bugger / wanker / tosser
      - "(b|B)[@4aA]+[sS$]+[tT]+[@4aA]+[rR]+[dD]+"
      - "(b|B)[oO0]+[lL]+[lL]+[oO0]+[cC]+[kK]+[sS$]*"
      - "(b|B)[uU]+[gG]+[gG]+[eE3]+[rR]+"
      - "(w|W)[@4aA]+[nN]+[kK]+[eE3]+[rR]+"
      - "(t|T)[oO0]+[sS$]+[sS$]+[eE3]+[rR]+"
      # fuck off / screw you / go to hell
      - "(f|F)[uU]+[cC]+[kK]+\\s*[oO0]+[fF]+[fF]*"
      - "(s|S)[cC]+[rR]+[eE3]+[wW]+\\s*[yY]+[oO0]+[uU]+"
      - "(g|G)[oO0]+\\s*[tT]+[oO0]+\\s*[hH]+[eE3]+[lL]+[lL]+"
      # racial slurs (n-word variants)
      - "(n|N)[iI!1]+[gG]+[gG]+[aA]+"
      - "(n|N)[iI!1]+[gG]+[gG]+[eE3]+[rR]+"
      - "(n|N)[1!]+[gG]+[gG]+[aA]+"

  # Phonetic matching (Soundex) for catching misspellings
  # When enabled, compares phonetic codes of words against profanity list
  # May produce false positives - use with caution
  phonetic-matching:
    enabled: false
    # Minimum phonetic similarity threshold (0.0-1.0)
    threshold: 0.85

  # Machine Learning toxicity detection (external API)
  # Requires a compatible toxicity classification endpoint
  # Off by default - enable and configure endpoint to use
  ml-toxicity:
    enabled: false
    # API endpoint URL (POST request with JSON body: {"text": "message"})
    # Expected response: {"toxic": true, "score": 0.95, "labels": ["profanity", "hate"]}
    endpoint: "http://localhost:8000/toxicity"
    # Timeout in milliseconds
    timeout-ms: 2000
    # Minimum toxicity score (0.0-1.0) to trigger censorship
    threshold: 0.8
    # Labels that trigger censorship (empty = all toxic labels)
    # Common labels: profanity, hate, harassment, violence, sexual
    toxic-labels:
      - "profanity"
      - "hate"
      - "harassment"
    # API key header (optional)
    api-key-header: ""
    api-key: ""

  # Character used for censoring matched words
  censor-char: "*"

  # If true, always replace matched words with exactly 4 censor characters
  # This prevents leaking word length as a hint about what was censored
  fixed-length-censor: false

  # If true, notify online staff (players with bantay.admin) when a message is censored
  # Shows the original uncensored message to staff silently
  notify-staff: false

# ==============================================================================
# CHAT COOLDOWN SETTINGS
# ==============================================================================
cooldown:
  chat:
    # Enable/disable chat message cooldown
    enabled: true

    # Cooldown duration in seconds
    seconds: 3

  command:
    # Enable/disable command cooldown
    enabled: true

    # Global command cooldown in seconds (applies to all commands unless overridden)
    seconds: 2

    # Per-command cooldown overrides (in seconds)
    # These override the global cooldown for specific commands
    per-command-overrides:
      "/spawn": 10
      "/tpa": 15
      "/home": 10
      "/warp": 5

    # Commands that should never be throttled (even without bypass permission)
    # Add essential commands here like /msg, /help, /rules, etc.
    exempt-commands: []

# ==============================================================================
# MESSAGES
# ==============================================================================
# All messages support &-style color codes (e.g., &c = red, &a = green, &e = yellow)
# Placeholders: {seconds} = remaining cooldown, {command} = command name

messages:
  # Prefix for all plugin messages
  prefix: "&8[&cBantay&8] &r"

  # Shown when a player tries to chat during cooldown
  chat-cooldown: "&cPlease wait {seconds} second(s) before chatting again."

  # Shown when a player tries to use a command during cooldown
  command-cooldown: "&cCommand &e{command} &cis on cooldown. Wait {seconds} second(s)."

  # Shown when config is reloaded successfully
  reload-success: "&aConfiguration reloaded successfully!"

  # Shown when bypass is toggled for a player
  bypass-enabled: "&aBypass enabled for &e{player}&a."
  bypass-disabled: "&cBypass disabled for &e{player}&c."

  # Shown when a player is not found for bypass command
  player-not-found: "&cPlayer '&e{player}&c' not found."

  # Help message header
  help-header: "&8&m----------- &cBantay &8&m-----------"
  help-reload: "&e/bantay reload &7- Reload configuration"
  help-bypass: "&e/bantay bypass <player> &7- Toggle bypass for a player"
  help-version: "&e/bantay version &7- Show plugin version"
  help-help: "&e/bantay help &7- Show this help message"
  help-footer: "&8&m--------------------------------"

  # Version message (supports {version} placeholder)
  version: "&eBantay &fv{version} &7by &fevnrca"